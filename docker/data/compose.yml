services:
  # Stockage objet S3-compatible pour la zone bronze du datalake (dev local).
  minio:
    image: minio/minio:latest
    container_name: homepedia-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (endpoint utilisé par le pipeline)
      - "9001:9001"   # Console web (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Crée le bucket bronze au démarrage (idempotent) puis se termine.
  # Attend que MinIO réponde (boucle de retry) — pas besoin de `mc` en local.
  minio-init:
    image: minio/mc:latest
    container_name: homepedia-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      HOMEPEDIA_S3_BUCKET: ${HOMEPEDIA_S3_BUCKET:-homepedia}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
        echo 'minio-init: en attente de MinIO...'; sleep 1;
      done;
      mc mb --ignore-existing \"local/$$HOMEPEDIA_S3_BUCKET\";
      echo \"minio-init: bucket prêt -> $$HOMEPEDIA_S3_BUCKET\";
      "

volumes:
  minio-data:
