name: homepedia-data

# Couche de données du pipeline médaillon DVF :
#   - MinIO    : stockage objet S3-compatible (Bronze/Silver en Parquet sur s3a://)
#   - PostGIS  : couche Gold (agrégats commune/dept + transactions filtrables)
#
# Les identifiants sont fournis via un fichier .env non commité (voir .env.data.example).
# Lancement : docker compose -f compose.data.yml up -d

services:
  minio:
    image: minio/minio:latest
    container_name: homepedia-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-homepedia}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Crée le bucket `homepedia` au démarrage puis se termine.
  minio-init:
    image: minio/mc:latest
    container_name: homepedia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-homepedia}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/homepedia;
      echo 'Bucket homepedia prêt';
      "

  postgis:
    image: postgis/postgis:16-3.4
    container_name: homepedia-postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-homepedia}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}"
      POSTGRES_DB: "${POSTGRES_DB:-homepedia}"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # API read-only des données DVF (choroplèthe prix/m²).
  api:
    build:
      context: ./api
    container_name: homepedia-api
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # En conteneur, la base est jointe via le réseau compose (service `postgis`).
      API_DATABASE_URL: "postgresql://${POSTGRES_USER:-homepedia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgis:5432/${POSTGRES_DB:-homepedia}"
      API_CORS_ORIGINS: '["http://localhost:5173"]'
    restart: unless-stopped

volumes:
  minio_data:
  postgis_data:
