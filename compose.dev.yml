name: homepedia

services:
  api:
    build:
      context: api
      dockerfile: docker/dev/Dockerfile
    container_name: homepedia-api-dev
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      # Préserver le venv du container (évite l'écrasement par le bind mount)
      - /app/.venv
    environment:
      - ENV=development
    restart: unless-stopped
