name: homepedia

# Webapp SEULE (legacy / dev autonome). Suppose une API lancée séparément sur
# l'hôte (d'où host.docker.internal). Pour l'app complète sur un réseau unifié
# — webapp + API + infra + pipeline — utiliser plutôt compose.app.yml (où la
# webapp atteint l'API par son nom de service `api`).
services:
  webapp:
    build:
      context: webapp
      dockerfile: docker/dev/Dockerfile
      args:
        USER_UID: "${UID:?}"
        USER_GID: "${GID:?}"
    container_name: homepedia-webapp-dev
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/app
    environment:
      - NODE_ENV=development
      # Cible du proxy Vite pour /api. L'API tourne via compose.data.yml ;
      # depuis le conteneur webapp, on l'atteint par l'hôte.
      - VITE_API_TARGET=http://host.docker.internal:8000
      # Variables Vite à définir si nécessaire :
      # - VITE_MAPBOX_TOKEN=your_token_here
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped